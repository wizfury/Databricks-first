command:
  - "streamlit"
  - "run"
  - "app.py"

env:
  - name: "DATABRICKS_APP_NAME"
    value: "ai-self-healing-pipeline"
  - name: "DEFAULT_CATALOG"
    value: "main"
  - name: "DEFAULT_SCHEMA"
    value: "ops"
  - name: "SQL_WAREHOUSE_ID"
    value: ""
  - name: "MODEL_SERVING_ENDPOINT"
    value: "databricks-meta-llama-3-3-70b-instruct"
  - name: "MOCK_MODE"
    value: "false"
  - name: "AUTO_RECOVERY_ENABLED"
    value: "false"
  - name: "DEFAULT_MAX_RETRIES"
    value: "3"
  - name: "DEFAULT_COOLDOWN_SECONDS"
    value: "60"
  - name: "STREAMLIT_SERVER_HEADLESS"
    value: "true"
  - name: "STREAMLIT_GATHER_USAGE_STATS"
    value: "false"
